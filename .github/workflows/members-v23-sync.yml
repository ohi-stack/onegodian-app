name: Members v2.3 Sync

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]

jobs:
  verify-members-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Members v2.3 contract
        run: node scripts/verify-members-v23.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build app
        run: npm run build
